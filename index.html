<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E5C29F">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>RK Finance - Loan Manager</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 10px; margin: 0; }
  .box { max-width: 950px; margin: auto; background: #fff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 10px; }
  h2 { margin: 0; color: #1e3a8a; font-size: 18px; }
  .rem { background: #fffbeb; border-left: 5px solid #f59e0b; padding: 10px; margin-bottom: 12px; border-radius: 5px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; background: #f8fafc; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .field { display: flex; flex-direction: column; }
  .field label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #334155; }
  input, select { padding: 9px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 14px; width: 100%; background: #fff; }
  .preview { background: #ecfdf5; border: 2px solid #10b981; color: #065f46; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 10px; text-align: center; font-size: 13px; }
  .add-btn { width: 100%; padding: 13px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 10px; cursor: pointer; }
  .tbl-wrap { overflow-x: auto; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; font-size: 13px; }
  th { background: #1e293b; color: #fff; }
  .btn { padding: 7px 9px; border: none; border-radius: 5px; color: #fff; cursor: pointer; font-size: 12px; margin: 2px; font-weight: bold; }
  .hist { margin-top: 14px; padding: 12px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <h2>💰 RK Finance - Loan Manager</h2>
    <button type="button" class="btn" style="background:#0f766e;" id="btnExcel">Export Excel</button>
  </div>
  <div class="rem"><b>🔔 Today Reminders:</b><div id="remBox" style="margin-top:4px;">No dues today.</div></div>
  <div class="grid">
    <div class="field"><label>Name</label><input type="text" id="pName" placeholder="Raj Mess"></div>
    <div class="field"><label>Initial Amount</label><input type="number" id="pAmt" placeholder="1500000"></div>
    <div class="field"><label>Interest %</label><input type="number" id="pRate" placeholder="2.5" step="0.1"></div>
    <div class="field"><label>Interest Months</label><input type="number" id="pMonths" value="1"></div>
    <div class="field"><label>Already Paid</label><input type="number" id="pPaid" value="0"></div>
    <div class="field"><label>Installment</label><input type="number" id="pInst" placeholder="37500"></div>
    <div class="field"><label>Type</label><select id="pType"><option value="Monthly">Monthly</option><option value="Daily">Daily</option></select></div>
    <div class="field"><label>Loan Date (Calendar)</label><input type="date" id="pLoanDate"></div>
    <div class="field"><label>Next Due (Calendar)</label><input type="date" id="pDate"></div>
  </div>
  <div class="preview" id="previewBox">1 Month Interest: 0 | Total Interest: 0 | Current Balance: 0</div>
  <button type="button" class="add-btn" id="btnAdd">+ Add Loan Account</button>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Name & Date</th><th>Initial</th><th>Interest %</th><th>Installment</th><th>Balance</th><th>Next Due</th><th>Actions</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
  <div id="histBox" class="hist">
    <div style="display:flex; justify-content:space-between; align-items:center;"><b id="histTitle">History</b><button type="button" class="btn" style="background:#64748b;" id="btnCloseHist">Close</button></div>
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Date</th><th>Month / Note</th><th>Amount</th><th>Balance</th></tr></thead><tbody id="histBody"></tbody></table>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
