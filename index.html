<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#E5C29F">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>RK Finance - Loan Manager</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 10px; margin: 0; }
  .box { max-width: 950px; margin: auto; background: #fff; padding: 14px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 10px; }
  h2 { margin: 0; color: #1e3a8a; font-size: 18px; }
  .rem { background: #fffbeb; border-left: 5px solid #f59e0b; padding: 10px; margin-bottom: 12px; border-radius: 5px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; background: #f8fafc; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; }
  .field { display: flex; flex-direction: column; }
  .field label { font-size: 11px; font-weight: bold; margin-bottom: 3px; color: #334155; }
  input, select { padding: 9px; border: 1px solid #94a3b8; border-radius: 6px; font-size: 14px; width: 100%; background: #fff; }
  .preview { background: #ecfdf5; border: 2px solid #10b981; color: #065f46; padding: 10px; border-radius: 6px; font-weight: bold; margin-top: 10px; text-align: center; font-size: 13px; }
  .add-btn { width: 100%; padding: 13px; background: #16a34a; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; margin-top: 10px; cursor: pointer; }
  .tbl-wrap { overflow-x: auto; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; min-width: 600px; }
  th, td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; font-size: 13px; }
  th { background: #1e293b; color: #fff; }
  .btn { padding: 7px 9px; border: none; border-radius: 5px; color: #fff; cursor: pointer; font-size: 12px; margin: 2px; font-weight: bold; }
  .hist { margin-top: 14px; padding: 12px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; display: none; }
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <h2>💰 RK Finance - Loan Manager</h2>
    <button type="button" class="btn" style="background:#0f766e;" id="btnExcel">Export Excel</button>
  </div>
  <div class="rem"><b>🔔 Today Reminders:</b><div id="remBox" style="margin-top:4px;">No dues today.</div></div>
  <div class="grid">
    <div class="field"><label>Name</label><input type="text" id="pName" placeholder="Raj Mess"></div>
    <div class="field"><label>Initial Amount</label><input type="number" id="pAmt" placeholder="1500000"></div>
    <div class="field"><label>Interest %</label><input type="number" id="pRate" placeholder="2.5" step="0.1"></div>
    <div class="field"><label>Interest Months</label><input type="number" id="pMonths" value="1"></div>
    <div class="field"><label>Already Paid</label><input type="number" id="pPaid" value="0"></div>
    <div class="field"><label>Installment</label><input type="number" id="pInst" placeholder="37500"></div>
    <div class="field"><label>Type</label><select id="pType"><option value="Monthly">Monthly</option><option value="Daily">Daily</option></select></div>
    <div class="field"><label>Loan Date (Calendar)</label><input type="date" id="pLoanDate"></div>
    <div class="field"><label>Next Due (Calendar)</label><input type="date" id="pDate"></div>
  </div>
  <div class="preview" id="previewBox">1 Month Interest: 0 | Total Interest: 0 | Current Balance: 0</div>
  <button type="button" class="add-btn" id="btnAdd">+ Add Loan Account</button>
  <div class="tbl-wrap">
    <table>
      <thead><tr><th>Name & Date</th><th>Initial</th><th>Interest %</th><th>Installment</th><th>Balance</th><th>Next Due</th><th>Actions</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
  <div id="histBox" class="hist">
    <div style="display:flex; justify-content:space-between; align-items:center;"><b id="histTitle">History</b><button type="button" class="btn" style="background:#64748b;" id="btnCloseHist">Close</button></div>
    <div class="tbl-wrap">
      <table><thead><tr><th>#</th><th>Date</th><th>Month / Note</th><th>Amount</th><th>Balance</th></tr></thead><tbody id="histBody"></tbody></table>
    </div>
  </div>
</div>

<script>
var db = [];

function todayISO() {
  var d = new Date();
  var mm = ("0" + (d.getMonth() + 1)).slice(-2);
  var dd = ("0" + d.getDate()).slice(-2);
  return d.getFullYear() + "-" + mm + "-" + dd;
}

function isoToDMY(iso) {
  if (!iso || iso.length < 10) return iso;
  return iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4);
}

function dmyToISO(dmy) {
  if (!dmy || dmy.length < 10) return todayISO();
  return dmy.slice(6, 10) + "-" + dmy.slice(3, 5) + "-" + dmy.slice(0, 2);
}

document.getElementById("pLoanDate").value = todayISO();
document.getElementById("pDate").value = todayISO();

try {
  var s = localStorage.getItem("rk_finance_v2");
  if (s) db = JSON.parse(s);
} catch (e) {}

function save() {
  try { localStorage.setItem("rk_finance_v2", JSON.stringify(db)); } catch (e) {}
}

function calc() {
  var a = Number(document.getElementById("pAmt").value) || 0;
  var r = Number(document.getElementById("pRate").value) || 0;
  var m = Number(document.getElementById("pMonths").value) || 0;
  var p = Number(document.getElementById("pPaid").value) || 0;
  var mi = (a * r) / 100;
  var ti = mi * m;
  var b = Math.max(0, (a + ti) - p);
  document.getElementById("previewBox").innerText =
    "1 Month Interest: " + mi + " | " + m + " Months Interest: " + ti + " | Current Balance: " + b;
}

document.getElementById("pAmt").addEventListener("input", calc);
document.getElementById("pRate").addEventListener("input", calc);
document.getElementById("pMonths").addEventListener("input", calc);
document.getElementById("pPaid").addEventListener("input", calc);

function addLoan() {
  var name = document.getElementById("pName").value.trim();
  var amt = Number(document.getElementById("pAmt").value) || 0;
  var rate = Number(document.getElementById("pRate").value) || 0;
  var months = Number(document.getElementById("pMonths").value) || 0;
  var paid = Number(document.getElementById("pPaid").value) || 0;
  var inst = Number(document.getElementById("pInst").value) || 0;
  var type = document.getElementById("pType").value;
  var lISO = document.getElementById("pLoanDate").value || todayISO();
  var dISO = document.getElementById("pDate").value || todayISO();

  if (!name || amt <= 0) {
    alert("Please enter Name and Initial Amount!");
    return;
  }

  var mi = (amt * rate) / 100;
  var bal = Math.max(0, (amt + (mi * months)) - paid);
  if (inst <= 0 && mi > 0) inst = mi;

  var lDMY = isoToDMY(lISO);
  var dDMY = isoToDMY(dISO);
  var hist = [];
  if (paid > 0) {
    hist.push({ date: lDMY, note: "Initial Paid (" + months + " Months)", amt: paid, bal: bal });
  }

  db.push({
    id: Date.now(), name: name, loanDate: lDMY, dueDate: dDMY, dueISO: dISO,
    amt: amt, rate: rate, intAmt: mi, inst: inst, type: type, bal: bal, history: hist
  });

  save();
  document.getElementById("pName").value = "";
  document.getElementById("pAmt").value = "";
  document.getElementById("pRate").value = "";
  document.getElementById("pMonths").value = "1";
  document.getElementById("pPaid").value = "0";
  document.getElementById("pInst").value = "";
  document.getElementById("pLoanDate").value = todayISO();
  document.getElementById("pDate").value = todayISO();
  calc();
  show();
}

document.getElementById("btnAdd").addEventListener("click", addLoan);
document.getElementById("btnCloseHist").addEventListener("click", function() {
  document.getElementById("histBox").style.display = "none";
});

function find(id) {
  return db.find(function(x) { return x.id === id; });
}

function pay(id) {
  var x = find(id);
  if (!x) return;
  var p = Number(prompt(x.name + " Paid Amount (Balance: " + x.bal + "):", x.inst));
  if (p > 0) {
    var cd = prompt("Collected Date (DD/MM/YYYY):", isoToDMY(todayISO())) || isoToDMY(todayISO());
    var nt = prompt("Month / Note:", "Installment Paid") || "Installment Paid";
    x.bal = Math.max(0, x.bal - p);
    x.history.push({ date: cd, note: nt, amt: p, bal: x.bal });
    var curISO = x.dueISO || dmyToISO(x.dueDate);
    var dt = new Date(curISO + "T00:00:00");
    if (x.type === "Daily") dt.setDate(dt.getDate() + 1);
    else dt.setMonth(dt.getMonth() + 1);
    var mm = ("0" + (dt.getMonth() + 1)).slice(-2);
    var dd = ("0" + dt.getDate()).slice(-2);
    x.dueISO = dt.getFullYear() + "-" + mm + "-" + dd;
    x.dueDate = isoToDMY(x.dueISO);
    save(); show(); hist(id);
  }
}

function oldMonth(id) {
  var x = find(id);
  if (!x) return;
  var m = prompt("Month Name (e.g. 7th Month Interest):", "7th Month Interest");
  if (!m) return;
  var cd = prompt("Collected Date (DD/MM/YYYY):", isoToDMY(todayISO())) || isoToDMY(todayISO());
  var p = Number(prompt("Amount:", x.intAmt)) || 0;
  if (p > 0) {
    x.history.push({ date: cd, note: m, amt: p, bal: x.bal });
    save(); hist(id);
  }
}

function addInt(id) {
  var x = find(id);
  if (!x) return;
  var ni = (x.amt * x.rate) / 100;
  if (confirm("Add next month interest " + ni + "?")) {
    x.bal += ni;
    x.history.push({ date: isoToDMY(todayISO()), note: "Next Month Interest (+)", amt: ni, bal: x.bal });
    save(); show(); hist(id);
  }
}

function hist(id) {
  var x = find(id);
  if (!x) return;
  document.getElementById("histTitle").innerText = x.name + " - History";
  var h = x.history.length ? "" : "<tr><td colspan='5'>No records.</td></tr>";
  var n = 0;
  x.history.forEach(function(r) {
    n++;
